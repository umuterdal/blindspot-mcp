name: Safety Release Gate

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Syntax check
        run: python -m compileall blindspot

      - name: Run governance tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run release gate script
        run: python scripts/release_gate.py --project-path . --output .blindspot/output/release_readiness_ci.json

      - name: Enforce policy-hash consistency gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path(".blindspot/output/release_readiness_ci.json").read_text(encoding="utf-8"))
          flags = report.get("flags", {})
          if not flags.get("policy_hash_consistency", False):
              raise SystemExit("policy_hash_consistency gate failed")
          if not report.get("ready_for_release", False):
              raise SystemExit("ready_for_release is false")
          print("policy_hash_consistency=pass")
          PY

      - name: Export required reports
        run: python scripts/export_required_reports.py --project-path . --out-dir .blindspot/output/reports_ci
