[project]
name = "blindspot-mcp"
version = "0.1.4"
description = "The External Brain for AI Coding Agents — see what your LLM can't see. Provides instant, structured intelligence about your entire codebase without reading files into the AI's context window."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Umut Erdal"},
]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai",
    "coding-assistant",
    "code-intelligence",
    "ripple-effect",
    "refactoring",
    "code-analysis",
    "claude",
    "cursor",
    "copilot",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=1.0.0",
    "tree-sitter>=0.24.0",
    "tree-sitter-php>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-c-sharp>=0.23.0",
    "tree-sitter-kotlin>=0.23.0",
    "tree-sitter-zig>=0.23.0",
    "watchdog>=4.0.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/umuterdal/blindspot-mcp"
Repository = "https://github.com/umuterdal/blindspot-mcp"
Issues = "https://github.com/umuterdal/blindspot-mcp/issues"

[project.scripts]
blindspot-mcp = "blindspot.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["blindspot*"]
