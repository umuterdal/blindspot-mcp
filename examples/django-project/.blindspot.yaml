# Blindspot MCP configuration for Django projects
language: python
framework: django

anti_patterns:
  enabled: true
  custom_rules:
    - name: "no-raw-sql"
      pattern: "\\.raw\\(|connection\\.cursor\\(|RawSQL\\("
      message: "Use Django ORM instead of raw SQL queries"
      severity: warning

    - name: "no-print-statements"
      pattern: "\\bprint\\("
      message: "Use logging module instead of print()"
      severity: warning

    - name: "no-star-import"
      pattern: "from .+ import \\*"
      message: "Avoid wildcard imports — import specific names"
      severity: error

    - name: "no-hardcoded-secrets"
      pattern: "(SECRET_KEY|PASSWORD|API_KEY)\\s*=\\s*['\"][^'\"]+['\"]"
      message: "Do not hardcode secrets — use environment variables"
      severity: error

syntax_check:
  enabled: true
  on_failure: rollback

scan_dirs:
  - apps
  - config
  - templates
  - static
  - tests
  - manage.py

exclude_dirs:
  - __pycache__
  - .venv
  - venv
  - staticfiles
  - media
  - htmlcov
  - node_modules
